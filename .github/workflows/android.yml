name: Android APK
on:
  push:
    branches: [main]
    paths: ['play.html', 'assets/**', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Prepare web bundle
        run: |
          mkdir -p build/www build/assets
          cp play.html build/www/index.html
          cp -r assets build/www/assets
          sed -i 's#href="./"#href="index.html"#g; s#href="privacy.html"#href="https://abodetahan.github.io/wanasa/privacy.html"#g' build/www/index.html
          cp app/icon.png build/assets/icon.png
          cp app/icon.png build/assets/splash.png
          cp app/icon.png build/assets/splash-dark.png
      - name: Create Capacitor project
        working-directory: build
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "ونّاسة" com.wanasa.game --web-dir www
          npx cap add android
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#002623' --splashBackgroundColor '#002623' || echo "icon generation skipped"
          npx cap sync android
      - name: Build APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../wanasa.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: تطبيق ونّاسة لأندرويد
          body: حمّل ملف wanasa.apk وثبّته على جوال أندرويد.
          files: wanasa.apk
